# Read the Docs configuration file for Sphinx projects
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Set the OS, Python version and other tools you might need
build:
  os: ubuntu-22.04
  tools:
    python: "3.13"
  jobs:
    pre_install:
      # These ecosystem packages are consumed from source until their first
      # compatible releases are available on PyPI.
      - python -m pip install --no-deps "git+https://github.com/audunarn/ANYgeometry.git"
      - python -m pip install --no-deps "git+https://github.com/audunarn/ANYmaterial.git"
      - python -m pip install --no-deps "git+https://github.com/audunarn/ANYmesh.git"
      - python -m pip install --no-deps "git+https://github.com/audunarn/ANYio.git"
      - git init ../anyfesolver-rtd
      - git -C ../anyfesolver-rtd fetch --depth=1 https://github.com/audunarn/ANYfeSolver.git f54e3cde5abf70cb8c989eb106119eedd3e33025
      - git -C ../anyfesolver-rtd checkout --detach FETCH_HEAD
      - python -m pip install --no-deps ../anyfesolver-rtd/packages/results ../anyfesolver-rtd

# Build documentation in the "docs/" directory with Sphinx
sphinx:
  configuration: docs/conf.py

python:
  install:
    - requirements: docs/requirements.txt
    - method: pip
      path: .
  # You can configure Sphinx to use a different builder, for instance use the dirhtml builder for simpler URLs
  # builder: "dirhtml"
  # Fail on all warnings to avoid broken references
  # fail_on_warning: true

# Optionally build your docs in additional formats such as PDF and ePub
# formats:
#   - pdf
#   - epub

# Optional but recommended, declare the Python requirements required
# to build your documentation
# See https://docs.readthedocs.io/en/stable/guides/reproducible-builds.html
# python:
#   install:
#     - requirements: docs/requirements.txt
