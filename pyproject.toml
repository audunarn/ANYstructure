[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = [
    "-ra",
    "-p",
    "no:cacheprovider",
    "-m",
    "not fem_integration and not release_authority and not slow",
]
markers = [
    "gui: opt-in test that creates a real Tk desktop window",
    "fem_integration: test that invokes an external FEM/import backend",
    "release_authority: isolated Git/release security qualification",
    "slow: long-running nonlinear, collision, transient, imperfection, or large-format qualification",
]

[tool.anystructure.ecosystem]
# setup.py remains the package-metadata authority; these mirror the compatible
# source ranges enforced by run_gui.py for release tooling.
anymesher = ">=0.4.0,<0.5"
anysolver = ">=0.4.1,<0.5"
any3dview = ">=0.5.5,<0.6"
anytk3d = ">=0.5.5,<0.6"
