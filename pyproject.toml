[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["-ra", "-p", "no:cacheprovider"]

[tool.anystructure.ecosystem]
# setup.py remains the package-metadata authority; these mirror the minimum
# source versions enforced by run_gui.py for release tooling.
anymesher = ">=0.2.5"
any3dview = ">=0.5"
anytk3d = ">=0.5"
