name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    name: Python tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ['3.13', '3.14']

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check out ANYmaterial
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: audunarn/ANYmaterial
          ref: 0591d4833806ee95bdd710c352a1f836af7b910e
          path: .ecosystem/ANYmaterial

      - name: Check out ANY3dView
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: audunarn/ANY3dView
          ref: 8b899b7a9d08a51d7899c34265b6b0b6e13da554
          path: .ecosystem/ANY3dView

      - name: Check out ANYgeometry
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: audunarn/ANYgeometry
          ref: 6a8b023ef6f65805519c96b56e025b4e3b457a1f
          path: .ecosystem/ANYgeometry

      - name: Check out ANYmesher
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: audunarn/ANYmesh
          ref: e79d14a03ef605afd947948e8588ccb8428eb52f
          path: .ecosystem/ANYmesh

      - name: Check out ANYfileio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: audunarn/ANYfileIO
          ref: da8bff840128ac1e183c77be9e5a53b2bb5c0834
          path: .ecosystem/ANYfileIO

      - name: Check out ANYsolver
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: audunarn/ANYsolver
          # Exact S3/Q4 qualification candidate; update only through review.
          ref: 2521db19031ea00053018ad09bb8474bf8a0671a
          path: .ecosystem/ANYsolver

      - name: Check out ANYbuckling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: audunarn/ANYbuckling
          ref: 4980ba75584c6e3ddec9d39a3d76fc215d691c09
          path: .ecosystem/ANYbuckling

      - name: Check out ANYtk3D
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: audunarn/ANYtk3D
          ref: 94fe0e0cf31faeeab182e0a51e3ead94849418f3
          path: .ecosystem/ANYtk3D

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps -e ".ecosystem/ANY3dView[gpu]" -e .ecosystem/ANYmaterial -e .ecosystem/ANYgeometry -e .ecosystem/ANYmesh -e ".ecosystem/ANYfileIO[semantics]" -e .ecosystem/ANYsolver -e .ecosystem/ANYbuckling -e .ecosystem/ANYtk3D
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .

      - name: Import package
        run: >-
          python -c "import anygeometry, anystruct, anysolver;
          from importlib.metadata import version;
          v = tuple(map(int, version('ANYsolver').split('.')[:3]));
          assert v >= (0, 4, 0);
          assert anysolver.__version__ == version('ANYsolver');
          print('anystruct import OK with ANYsolver', anysolver.__version__)"

      - name: Run pytest
        run: python -m pytest

      - name: Run GUI smoke on Windows
        if: runner.os == 'Windows'
        run: |
          python -m tests.gui_automatic_run
          python -m tests.gui_fe_runtime_smoke

      - name: Run GUI smoke on Linux
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a python -m tests.gui_automatic_run
          xvfb-run -a python -m tests.gui_fe_runtime_smoke

  package:
    name: Build and clean-wheel smoke
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check out ANYmaterial
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: audunarn/ANYmaterial
          ref: 0591d4833806ee95bdd710c352a1f836af7b910e
          path: .ecosystem/ANYmaterial

      - name: Check out ANY3dView
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: audunarn/ANY3dView
          ref: 8b899b7a9d08a51d7899c34265b6b0b6e13da554
          path: .ecosystem/ANY3dView

      - name: Check out ANYgeometry
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: audunarn/ANYgeometry
          ref: 6a8b023ef6f65805519c96b56e025b4e3b457a1f
          path: .ecosystem/ANYgeometry

      - name: Check out ANYmesher
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: audunarn/ANYmesh
          ref: e79d14a03ef605afd947948e8588ccb8428eb52f
          path: .ecosystem/ANYmesh

      - name: Check out ANYfileio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: audunarn/ANYfileIO
          ref: da8bff840128ac1e183c77be9e5a53b2bb5c0834
          path: .ecosystem/ANYfileIO

      - name: Check out ANYsolver
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: audunarn/ANYsolver
          # Exact S3/Q4 qualification candidate; update only through review.
          ref: 2521db19031ea00053018ad09bb8474bf8a0671a
          path: .ecosystem/ANYsolver

      - name: Check out ANYbuckling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: audunarn/ANYbuckling
          ref: 4980ba75584c6e3ddec9d39a3d76fc215d691c09
          path: .ecosystem/ANYbuckling

      - name: Check out ANYtk3D
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: audunarn/ANYtk3D
          ref: 94fe0e0cf31faeeab182e0a51e3ead94849418f3
          path: .ecosystem/ANYtk3D

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps -e ".ecosystem/ANY3dView[gpu]" -e .ecosystem/ANYmaterial -e .ecosystem/ANYgeometry -e .ecosystem/ANYmesh -e ".ecosystem/ANYfileIO[semantics]" -e .ecosystem/ANYsolver -e .ecosystem/ANYbuckling -e .ecosystem/ANYtk3D
          python -m pip install -r requirements.txt
          python -m pip install build twine

      - name: Build and check distributions
        run: |
          python -m build
          python -m twine check dist/*

      - name: Import wheel from a clean environment
        shell: bash
        run: |
          set -euo pipefail
          smoke_dir="$RUNNER_TEMP/anystructure-wheel-smoke"
          python -m venv "$smoke_dir"
          smoke_python="$smoke_dir/bin/python"
          "$smoke_python" -m pip install --upgrade pip
          "$smoke_python" -m pip install --no-deps \
            "$GITHUB_WORKSPACE/.ecosystem/ANY3dView[gpu]" \
            "$GITHUB_WORKSPACE/.ecosystem/ANYgeometry" \
            "$GITHUB_WORKSPACE/.ecosystem/ANYmaterial" \
            "$GITHUB_WORKSPACE/.ecosystem/ANYmesh" \
            "$GITHUB_WORKSPACE/.ecosystem/ANYfileIO[semantics]" \
            "$GITHUB_WORKSPACE/.ecosystem/ANYsolver" \
            "$GITHUB_WORKSPACE/.ecosystem/ANYbuckling" \
            "$GITHUB_WORKSPACE/.ecosystem/ANYtk3D"
          "$smoke_python" -m pip install -r "$GITHUB_WORKSPACE/requirements.txt"
          wheel_files=("$GITHUB_WORKSPACE"/dist/*.whl)
          test "${#wheel_files[@]}" -eq 1
          "$smoke_python" -m pip install --no-deps "${wheel_files[0]}"
          "$smoke_python" -m pip check
          cd "$RUNNER_TEMP"
          "$smoke_python" -c "import any3dview, anybuckling, anyfileio, anygeometry, anymaterial, anymesher, anysolver, anystruct, anytk3d; from importlib.metadata import version; print('clean wheel import OK', version('ANYstructure'))"
