name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-manual:
    name: Build candidate artifacts manually
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out candidate source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.x"
      - name: Install release tooling
        run: python -m pip install --upgrade build twine
      - name: Build wheel and source distribution
        run: python -m build --outdir dist
      - name: Check distribution metadata
        run: python -m twine check dist/*
      - name: Write release checksums
        shell: bash
        run: |
          cd dist
          sha256sum *.whl *.tar.gz > ANYstructure-6.4.0-SHA256SUMS.txt
      - name: Store candidate release assets
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish-production:
    name: Publish verified release assets to PyPI
    if: >-
      github.event_name == 'release' &&
      github.event.release.draft == false &&
      github.event.release.prerelease == false
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ANYstructure
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the ledger-only release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Download the complete prebuilt release asset set
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          mkdir release-assets
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir release-assets
      - name: Verify sole-child ledger authority and exact distributions
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python tools/verify_release_authority.py \
            --ledger docs/release/anystructure-6.4.0-ledger.json \
            --assets release-assets \
            --output dist \
            --tag "$RELEASE_TAG" \
            --protected-ref refs/remotes/origin/master \
            --expected-terminal ACCEPTED_ANYSTRUCTURE_6_4_0_RELEASE \
            --distribution ANYstructure \
            --version 6.4.0 \
            --checksum-name ANYstructure-6.4.0-SHA256SUMS.txt \
            --artifact anystructure-6.4.0-py3-none-any.whl \
            --artifact anystructure-6.4.0.tar.gz
      - name: Publish exact ledger-authorized distributions
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/
