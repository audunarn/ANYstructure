name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and validate distributions
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Verify that the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          setup_text = Path("setup.py").read_text(encoding="utf-8")
          match = re.search(r"^\s*version\s*=\s*['\"]([^'\"]+)['\"]", setup_text, re.MULTILINE)
          if match is None:
              raise SystemExit("Could not read the package version from setup.py")
          version = match.group(1)
          tag_version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          if version != tag_version:
              raise SystemExit(
                  f"Tag {os.environ['GITHUB_REF_NAME']!r} does not match "
                  f"project version {version!r}."
              )
          PY
      - name: Install release tooling
        run: python -m pip install --upgrade build twine
      - name: Build wheel and source distribution
        run: python -m build --outdir dist
      - name: Check distribution metadata
        run: python -m twine check dist/*
      - name: Store distributions for the publishing job
        uses: actions/upload-artifact@v5
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish distributions to PyPI
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ANYstructure
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download validated distributions
        uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish distributions using Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
